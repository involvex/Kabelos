name: Toolchain upgrade validation

on:
  pull_request:
    branches:
      - upgrade/toolchain-wip

jobs:
  validate_toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'

      - name: Flutter --version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Run Gradle wrapper update (9.1)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew wrapper --gradle-version 9.1 --distribution-type all || true

      - name: Assemble Debug (validate build)
        working-directory: android
        run: ./gradlew --no-daemon clean assembleDebug

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android/app/build/outputs/**/*.apk
