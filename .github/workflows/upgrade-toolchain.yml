name: Toolchain upgrade validation

on:
  pull_request:
    branches:
      - main

jobs:
  validate_toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter SDK (git clone, retry)
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y git xz-utils unzip
          FLUTTER_DIR="$HOME/flutter"
          rm -rf "$FLUTTER_DIR"
          for i in 1 2 3; do
            git clone --depth 1 https://github.com/flutter/flutter.git "$FLUTTER_DIR" && break || { echo "Clone failed, retrying..."; sleep 5; }
            if [ "$i" -eq 3 ]; then exit 1; fi
          done
          cd "$FLUTTER_DIR"
          git fetch --tags --quiet || true
          if git rev-parse --verify "3.44.0" >/dev/null 2>&1; then git checkout 3.44.0; else git checkout stable; fi
          echo "$FLUTTER_DIR/bin" >> "$GITHUB_PATH"
        shell: bash

      - name: Flutter --version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Run Gradle wrapper update (9.1)
        working-directory: android
        run: |
          set -eux
          pwd
          ls -la
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew wrapper --gradle-version 8.7 --distribution-type bin || true
          else
            echo "gradlew not found in android/; skipping wrapper update"
          fi

      - name: Assemble Debug (validate build)
        working-directory: android
        run: |
          set -eux
          if [ -f gradlew ]; then
            ./gradlew --no-daemon clean assembleDebug
          else
            # Fallback to system gradle if gradlew is not present
            gradle --no-daemon clean assembleDebug
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android/app/build/outputs/**/*.apk
