name: Toolchain upgrade validation

on:
  pull_request:
    branches:
      - main

jobs:
  validate_toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'

      - name: Flutter --version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Run Gradle wrapper update (9.1)
        working-directory: android
        run: |
          set -eux
          pwd
          ls -la
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew wrapper --gradle-version 8.7 --distribution-type bin || true
          else
            echo "gradlew not found in android/; skipping wrapper update"
          fi

      - name: Assemble Debug (validate build)
        working-directory: android
        run: |
          set -eux
          if [ -f gradlew ]; then
            ./gradlew --no-daemon clean assembleDebug
          else
            # Fallback to system gradle if gradlew is not present
            gradle --no-daemon clean assembleDebug
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android/app/build/outputs/**/*.apk
