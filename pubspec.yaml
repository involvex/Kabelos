name: kabelos
description: "Kabelos - share files between nearby devices over Wi-Fi Direct."
publish_to: 'none'

version: 3.0.0+3001

environment:
  sdk: ^3.8.1
  flutter: 3.44.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  cupertino_icons: ^1.0.8

  provider: ^6.1.1

  # Kabelos: photo library picker for simple sharing
  image_picker: ^1.1.2

  # Kabelos: QR code rendering and scanning for the identity helper
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # Kabelos: friendly permission prompts (Android 13+ NEARBY_WIFI_DEVICES, etc.)
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true

  uses-material-design: true

flutter_launcher_icons:
  android: true
  image_path: "assets/icon.png"
